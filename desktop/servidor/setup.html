<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>EL-PACK Servidor — Configuração</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0c0e;
        color: #f5f6f7;
        padding: 28px 32px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.subtitulo {
        color: #a7adb6;
        font-size: 13px;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #a7adb6;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #242830;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        color: #f5f6f7;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      input:focus {
        outline: none;
        border-color: #2aa866;
      }
      small.ajuda {
        display: block;
        margin-top: -12px;
        margin-bottom: 16px;
        color: #6e7480;
        font-size: 11px;
      }
      button {
        width: 100%;
        padding: 11px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #2aa866, #1f8a54);
        color: white;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #erro {
        display: none;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        margin-bottom: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>EL-PACK — Configuração do Servidor</h1>
    <p class="subtitulo">
      Esta máquina vai guardar os dados de todos. Informe a conexão com o PostgreSQL já instalado aqui.
    </p>

    <div id="erro"></div>

    <form id="form">
      <label for="databaseUrl">String de conexão do PostgreSQL</label>
      <input
        id="databaseUrl"
        type="text"
        placeholder="postgresql://postgres:SENHA@localhost:5432/gestao_pedidos?schema=public"
        required
      />
      <small class="ajuda">A mesma usada no arquivo .env do backend em desenvolvimento.</small>

      <label for="port">Porta do servidor</label>
      <input id="port" type="number" value="3333" required />
      <small class="ajuda">Os computadores clientes vão usar essa porta para se conectar.</small>

      <button id="botao" type="submit">Salvar e iniciar servidor</button>
    </form>

    <script>
      const form = document.getElementById("form");
      const botao = document.getElementById("botao");
      const erroDiv = document.getElementById("erro");

      window.servidorApp.aoReceberErroSetup((msg) => {
        erroDiv.textContent = msg;
        erroDiv.style.display = "block";
        botao.disabled = false;
        botao.textContent = "Salvar e iniciar servidor";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        erroDiv.style.display = "none";
        botao.disabled = true;
        botao.textContent = "Conectando e preparando o banco...";

        const databaseUrl = document.getElementById("databaseUrl").value.trim();
        const port = Number(document.getElementById("port").value) || 3333;

        await window.servidorApp.salvarConfigInicial({ databaseUrl, port });
      });
    </script>
  </body>
</html>
