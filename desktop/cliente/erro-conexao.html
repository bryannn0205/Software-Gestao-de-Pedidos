<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Extrusaick Polímeros — Sem conexão</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0c0e;
        color: #f5f6f7;
        padding: 40px;
        text-align: center;
      }
      h1 {
        font-size: 18px;
        margin: 60px 0 8px;
      }
      p {
        color: #a7adb6;
        font-size: 13px;
        margin: 0 0 28px;
      }
      code {
        color: #2aa866;
      }
      button {
        width: 260px;
        padding: 11px;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      #tentar {
        background: linear-gradient(135deg, #2aa866, #1f8a54);
        color: white;
      }
      #reconfigurar {
        background: #1c1f24;
        color: #a7adb6;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
    </style>
  </head>
  <body>
    <h1>Não foi possível conectar ao servidor</h1>
    <p>
      Verifique se o computador do Extrusaick - Servidor está ligado e conectado na rede.<br />
      Endereço configurado: <code id="endereco"></code>
    </p>

    <button id="tentar" type="button">Tentar novamente</button><br />
    <button id="reconfigurar" type="button">Reconfigurar servidor</button>

    <script>
      const params = new URLSearchParams(window.location.search);
      document.getElementById("endereco").textContent = params.get("servidor") ?? "";

      document.getElementById("tentar").addEventListener("click", () => {
        window.clienteApp.tentarNovamente();
      });
      document.getElementById("reconfigurar").addEventListener("click", () => {
        window.clienteApp.reconfigurar();
      });
    </script>
  </body>
</html>
