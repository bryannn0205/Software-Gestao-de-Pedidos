<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>EL-PACK — Conectar ao servidor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0c0e;
        color: #f5f6f7;
        padding: 28px 32px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.subtitulo {
        color: #a7adb6;
        font-size: 13px;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #a7adb6;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #242830;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        color: #f5f6f7;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input:focus {
        outline: none;
        border-color: #2aa866;
      }
      small.ajuda {
        display: block;
        margin-bottom: 16px;
        color: #6e7480;
        font-size: 11px;
      }
      button {
        width: 100%;
        padding: 11px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #2aa866, #1f8a54);
        color: white;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #erro {
        display: none;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        margin-bottom: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>EL-PACK — Conectar ao servidor</h1>
    <p class="subtitulo">
      Informe o endereço do computador que está rodando o EL-PACK Servidor na rede da empresa.
    </p>

    <div id="erro"></div>

    <form id="form">
      <label for="endereco">Endereço do servidor</label>
      <input id="endereco" type="text" placeholder="192.168.0.10:3333" required />
      <small class="ajuda">Peça esse endereço para quem configurou o EL-PACK Servidor.</small>

      <button id="botao" type="submit">Conectar</button>
    </form>

    <script>
      const form = document.getElementById("form");
      const botao = document.getElementById("botao");
      const erroDiv = document.getElementById("erro");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        erroDiv.style.display = "none";
        botao.disabled = true;
        botao.textContent = "Conectando...";

        const endereco = document.getElementById("endereco").value.trim();
        const resultado = await window.clienteApp.testarESalvarServidor(endereco);

        if (!resultado.ok) {
          erroDiv.textContent = resultado.erro;
          erroDiv.style.display = "block";
          botao.disabled = false;
          botao.textContent = "Conectar";
        }
      });
    </script>
  </body>
</html>
